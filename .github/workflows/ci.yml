name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── C++ 构建 + 测试
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 系统依赖 ---
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libyaml-cpp-dev \
            libboost-all-dev \
            ninja-build

      # ---- CMake 构建 ----
      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build

      # ---- 后续加测试 ----
      # - name: Test
      #   run: cd build && ctest --output-on-failure

  # ── 集成冒烟测试 ─────────────────────────────────────
  smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libyaml-cpp-dev \
            libboost-all-dev \
            ninja-build

      - name: Build
        run: cmake -B build -G Ninja && cmake --build build

      - name: Smoke test — pub/sub round-trip
        run: |
          set -e

          # 1. 启动 discovery daemon(后台)
          ./build/core/examples/discovery_daemon &
          DAEMON_PID=$!
          sleep 1

          # 2. 启动 listener(后台,捕获输出)
          ./build/core/examples/listener > /tmp/listener.log 2>&1 &
          LISTENER_PID=$!
          sleep 1

          # 3. 启动 talker 发 3 条消息后退出
          timeout 5 ./build/core/examples/talker > /tmp/talker.log 2>&1 || true
          sleep 1

          # 4. 验证 listener 收到了消息
          kill $LISTENER_PID 2>/dev/null || true
          kill $DAEMON_PID 2>/dev/null || true

          echo "=== Listener output ==="
          cat /tmp/listener.log

          if grep -q "Receive:" /tmp/listener.log; then
            echo "✓ Smoke test passed: listener received messages"
          else
            echo "✗ Smoke test failed: no messages received"
            exit 1
          fi
